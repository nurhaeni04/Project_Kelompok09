services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lab
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  event-service:
    build: ./services/event-service
    container_name: event-service
    environment:
      DATABASE_URL: postgres://postgres:lab@postgres:5432/events
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    restart: unless-stopped

  ticket-service:
    build: ./services/ticket-service
    container_name: ticket-service
    environment:
      DATABASE_URL: postgres://postgres:lab@postgres:5432/tickets
      PAYMENT_SERVICE_URL: http://payment-service:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3000"
    restart: unless-stopped

  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    environment:
      DATABASE_URL: postgres://postgres:lab@postgres:5432/payments
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3003:3000"
    restart: unless-stopped

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    environment:
      DATABASE_URL: postgres://postgres:lab@postgres:5432/notifications
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3004:3000"
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - event-service
      - ticket-service
      - payment-service
      - notification-service
    restart: unless-stopped

volumes:
  postgres_data: