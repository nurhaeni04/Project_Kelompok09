events {
    worker_connections 1024;
}

http {
    upstream event_service {
        server event-service:3000;
    }

    upstream ticket_service {
        server ticket-service:3000;
    }

    upstream payment_service {
        server payment-service:3000;
    }

    upstream notification_service {
        server notification-service:3000;
    }

    server {
        listen 8080;

        location /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"nginx"}';
        }

        location /events {
            proxy_pass        http://event_service;
            proxy_set_header  Host             $host;
            proxy_set_header  X-Real-IP        $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
        }

        location /tickets {
            proxy_pass        http://ticket_service;
            proxy_set_header  Host             $host;
            proxy_set_header  X-Real-IP        $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
        }

        location /orders {
            proxy_pass        http://ticket_service;
            proxy_set_header  Host             $host;
            proxy_set_header  X-Real-IP        $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
        }

        location /payments {
            proxy_pass        http://payment_service;
            proxy_set_header  Host             $host;
            proxy_set_header  X-Real-IP        $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
        }

        location /notifications {
            proxy_pass        http://notification_service;
            proxy_set_header  Host             $host;
            proxy_set_header  X-Real-IP        $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
        }
    }
}
